# bf-analyzer behind nginx: http://<pi>/bfpris/ on the local network only.
# Its own server block for the Pi's LAN names, so other sites and "/" are untouched.
# pi/install.sh fills in @NAMES@ and installs this as /etc/nginx/sites-available/bf-analyzer.
server {
    listen 80;
    listen [::]:80;
    server_name @NAMES@;

    location /bfpris/ {
        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 169.254.0.0/16;
        allow ::1;
        allow fc00::/7;
        allow fe80::/10;
        deny all;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location = /bfpris {
        return 301 /bfpris/;
    }
    # everything else behaves as before this block existed (nginx's usual http -> https redirect)
    location / {
        return 301 https://$host$request_uri;
    }
}
